name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated data is committed
        run: git diff --exit-code -- src/data
      - name: Version is bumped (docs/WORKFLOW.md)
        if: github.event_name == 'pull_request'
        run: node scripts/check-version.js "$(git show origin/${{ github.base_ref }}:package.json | node -pe 'JSON.parse(require("fs").readFileSync(0)).version')"
